name: windows-build-sign

# Build the native GUI on a GitHub-hosted Windows runner and submit the
# unsigned artifact to SignPath. The SignPath action signs it in SignPath's HSM;
# the signed file is uploaded back as a workflow artifact.
#
# Required repository configuration after SignPath Foundation approval:
#   secrets.SIGNPATH_API_TOKEN
#   vars.SIGNPATH_ORGANIZATION_ID
#   vars.SIGNPATH_PROJECT_SLUG              (e.g. netprism)
#   vars.SIGNPATH_SIGNING_POLICY_SLUG       (e.g. release-signing)
#   vars.SIGNPATH_ARTIFACT_CONFIG_SLUG      (e.g. netprism-gui)
#
# Until those are configured the build step still produces an unsigned artifact;
# the signing step will fail clearly instead of pretending to sign.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install PySide6==6.8.3 "onnx>=1.16" pyinstaller
          python -m pip install pytest

      - name: GUI smoke tests (headless)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/test_gui.py -q

      - name: Build one-file GUI
        shell: pwsh
        run: |
          .\scripts\build_gui.ps1 -Python python -OneFile

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: NetPrismGUI-unsigned
          path: dist/gui/NetPrismGUI.exe
          if-no-files-found: error
          archive: false

      - name: Submit to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true
          parameters: |
            version: "${{ github.ref_name }}"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPrismGUI-signed
          path: signed/NetPrismGUI.exe
          if-no-files-found: error
